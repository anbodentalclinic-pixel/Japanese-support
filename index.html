<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>国語学習サポート</title>
<meta name="robots" content="noindex, nofollow">

<style>
:root{
  --paper:#F5F7F3; --sheet:#FFFFFF; --ink:#24272B; --pencil:#686E76;
  --grid:#4E8A69; --grid-soft:#DCE9E0; --red:#D3302F; --red-soft:#FBE3E1; --ok:#2F7D55;
  --kyo:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#181C1A; --sheet:#212624; --ink:#E7EAE5; --pencil:#A2A9A4;
    --grid:#71B48F; --grid-soft:#2C3832; --red:#FF6B66; --red-soft:#3A2423; --ok:#7CCB9E;
  }
}
:root[data-theme="dark"]{
  --paper:#181C1A; --sheet:#212624; --ink:#E7EAE5; --pencil:#A2A9A4;
  --grid:#71B48F; --grid-soft:#2C3832; --red:#FF6B66; --red-soft:#3A2423; --ok:#7CCB9E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{font-family:var(--kyo);font-weight:600;font-size:24px;letter-spacing:.08em;margin:0;display:flex;align-items:center;gap:10px}
.logo .box{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--grid);color:var(--red);font-size:24px}
.back{background:none;border:none;color:var(--pencil);padding:6px 0;font-size:15px}
.date{color:var(--pencil);font-size:14px}
h2{font-family:var(--kyo);font-weight:600;font-size:22px;margin:4px 0 12px}
h3{font-size:15px;font-weight:700;margin:20px 0 8px;color:var(--pencil)}
p{margin:0 0 12px}
.menu{display:grid;gap:12px}
.task{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:16px}
.task:hover{border-color:var(--grid)}
.task .num{font-family:var(--kyo);font-size:30px;width:52px;height:52px;flex:none;display:grid;place-items:center;border:2px solid var(--grid);color:var(--grid)}
.task .t{font-weight:700;font-size:17px;display:block}
.task .s{color:var(--pencil);font-size:14px}
.task.done .num{border-color:var(--red);color:var(--red)}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.subbtn{background:none;border:1.5px dashed var(--grid-soft);border-radius:6px;padding:12px;text-align:left}
.subbtn b{display:block;font-size:15px}
.subbtn span{font-size:13px;color:var(--pencil)}
.streak{margin:18px 0 0;color:var(--pencil);font-size:14px}
.card{background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:20px;position:relative}
.big{font-family:var(--kyo);font-size:44px;line-height:1.3;text-align:center;margin:8px 0;letter-spacing:.06em}
.phrase{font-family:var(--kyo);font-size:20px;text-align:center;color:var(--pencil)}
.phrase em{font-style:normal;color:var(--ink);border-bottom:2px solid var(--grid)}
.unit{font-size:13px;color:var(--pencil)}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:none;border-radius:6px;padding:14px;font-weight:700;font-size:16px;background:var(--grid);color:#fff}
.btn.line{background:none;border:1.5px solid var(--grid);color:var(--grid)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.dots i{width:10px;height:10px;border:1.5px solid var(--grid);border-radius:50%}
.dots i.on{background:var(--grid)}
.dots i.ng{background:var(--red);border-color:var(--red)}
.maru{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.maru circle{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .55s ease-out forwards;opacity:.85}
@keyframes draw{to{stroke-dashoffset:40}}
@media (prefers-reduced-motion:reduce){.maru circle{animation:none;stroke-dashoffset:40}}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:4px;background:var(--grid-soft);border-radius:2px}
.steps span.on{background:var(--grid)}
.q{font-family:var(--kyo);font-size:18px;line-height:1.8;border-left:4px solid var(--grid);padding:2px 0 2px 12px;margin:0 0 14px}
.passage{font-family:var(--kyo);font-size:18px;line-height:2}
.sent{display:inline;border-radius:3px;padding:1px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sent.sel{background:var(--grid-soft);box-shadow:inset 0 -2px 0 var(--grid)}
.sent.right{background:var(--grid-soft);box-shadow:inset 0 -3px 0 var(--ok)}
.sent.miss{box-shadow:inset 0 -3px 0 var(--red)}
.sent.wrong{background:var(--red-soft)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1.5px solid var(--grid-soft);background:var(--sheet);border-radius:6px;padding:14px;font-size:17px;font-weight:700}
.choice.ok{border-color:var(--ok);color:var(--ok)}
.choice.ng{border-color:var(--red);color:var(--red)}
.note{background:var(--grid-soft);border-radius:6px;padding:12px 14px;font-size:15px;margin-top:14px}
.note.red{background:var(--red-soft)}
.frame{font-family:var(--kyo);font-size:17px;padding:10px 12px;border:1.5px dashed var(--grid);border-radius:6px;margin:0 0 12px}
textarea,input,select{width:100%;font-family:var(--kyo);font-size:18px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--grid-soft);border-radius:6px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:14px;color:var(--pencil);margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;border:1.5px solid var(--grid-soft);color:var(--pencil)}
.chip.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.chip.ng{border-color:var(--red);color:var(--red)}
.genko-wrap{overflow-x:auto;margin:6px 0 4px;padding-bottom:4px}
.genko{display:flex;direction:rtl;gap:0;width:max-content;margin-left:auto;border:1.5px solid var(--grid)}
.gcol{direction:ltr;display:flex;flex-direction:column;border-left:1px solid var(--grid)}
.gcol:last-child{border-left:none}
.gcell{width:30px;height:30px;border-bottom:1px solid var(--grid-soft);display:grid;place-items:center;font-family:var(--kyo);font-size:19px;writing-mode:vertical-rl;line-height:1}
.gcell:last-child{border-bottom:none}
.gcell.over{background:var(--red-soft);color:var(--red)}
.gcell.limit{border-bottom:2px solid var(--red)}
.gnum{font-size:10px;color:var(--pencil);text-align:center;direction:ltr;padding:2px 0;border-top:1px solid var(--grid)}
.selfeval{display:flex;gap:10px;margin-top:12px}
.selfeval button{flex:1;font-family:var(--kyo);font-size:26px;padding:8px;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px}
.selfeval button span{display:block;font-family:var(--ui);font-size:12px;color:var(--pencil)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:12px 14px}
.item .mk{font-family:var(--kyo);font-size:22px;width:32px;text-align:center;color:var(--red);flex:none}
.item .mk.none{color:var(--grid-soft)}
.item small{display:block;color:var(--pencil);font-size:13px}
ol.flow{padding-left:1.4em;margin:0}
ol.flow li{margin-bottom:10px}
.sentence{font-family:var(--kyo);font-size:22px;line-height:2.2;display:flex;flex-wrap:wrap;align-items:center}
.ch{padding:0 1px}
.gap{border:none;background:none;width:14px;height:40px;padding:0;position:relative;color:var(--grid-soft)}
.gap::after{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:currentColor;opacity:.5}
.gap.on{color:var(--red)}
.gap.on::after{opacity:1;transform:rotate(18deg)}
.gap.miss{color:var(--ok)}
.gap.miss::after{opacity:1;transform:rotate(18deg)}
.units label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid-soft);font-size:16px}
.units input{width:22px;height:22px;flex:none}
.bar{height:6px;background:var(--grid-soft);border-radius:3px;overflow:hidden;margin-top:4px;flex:1}
.bar i{display:block;height:100%;background:var(--grid)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--pencil)}
.foot{margin-top:28px;font-size:13px;color:var(--pencil);display:flex;gap:16px;flex-wrap:wrap}
.foot button{background:none;border:none;color:var(--pencil);text-decoration:underline;padding:0;font-size:13px}
.evc{display:block;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:12px 14px;margin-bottom:8px;font-family:var(--kyo);font-size:17px;line-height:1.7}
.evc.sel{border-color:var(--grid);background:var(--grid-soft)}
.evc.good{border-color:var(--ok)}
.evc.bad{border-color:var(--red);background:var(--red-soft)}
.evc.missed{border-color:var(--ok);border-style:dashed}
.evc small{display:block;font-family:var(--ui);font-size:13px;color:var(--pencil);margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:12px 14px;margin-bottom:8px;font-size:16px}
.opt.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.ng{border-color:var(--red);color:var(--red)}
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.built{border:1.5px dashed var(--grid);border-radius:6px;padding:8px;margin-bottom:12px}
.wcard{font-family:var(--kyo);font-size:17px;background:var(--sheet);border:1.5px solid var(--grid);border-radius:4px;padding:8px 10px;line-height:1.4}
.wcard.used{opacity:.25;pointer-events:none}
.wcard.wrong{border-color:var(--red);color:var(--red)}
.ref{font-size:15px;background:var(--grid-soft);border-radius:6px;padding:10px 12px;margin-bottom:14px}
.ref b{font-family:var(--kyo);font-size:17px}
.stepname{display:flex;gap:4px;margin-bottom:14px;font-size:12px;color:var(--pencil)}
.stepname span{flex:1;text-align:center;border-top:4px solid var(--grid-soft);padding-top:4px}
.stepname span.on{border-color:var(--grid);color:var(--ink);font-weight:700}
.lvdots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.lvdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--grid)}
.lvdots i.on{background:var(--grid)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px}
.checkline input{width:20px;height:20px;flex:none;margin-top:3px}
.trialbtn{display:block;width:100%;margin:22px 0 8px;padding:10px 12px;border:1px dashed var(--pencil);border-radius:10px;background:none;color:var(--pencil);font-size:13px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.trialbtn.on{border:2px solid var(--red);background:var(--red-soft);color:var(--red);font-weight:700}
.trialtag{margin-left:auto;margin-right:10px;white-space:nowrap;flex-shrink:0;padding:2px 8px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;font-weight:700}
.gsent{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.gchip{font-family:var(--kyo);font-size:18px;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:8px 10px;line-height:1.3}
.gchip.static{display:inline-block}
.gchip.hi{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px;text-decoration-color:var(--red)}
.gchip.sel{border-color:var(--grid);background:var(--grid-soft);font-weight:700}
.gchip.good{border-color:var(--ok);border-width:2.5px;background:var(--grid-soft)}
.gchip.miss{border:2.5px dashed var(--ok)}
.gchip.bad{border-color:var(--red);border-width:2.5px;background:var(--red-soft)}
</style>
</head>

</script>
<script>
const KEY="kokugo-lab-v1";
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):{};}catch(e){return {};}}
function save(){if(trialOn())return;try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=Object.assign({kanji:{},extraKanji:[],units:{},daily:{},kij:{},tsu:{},rev:{},extraRev:[],bun:{},gram:{},plan:{},quiz:{},days:[]},load());
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const UNIT_NAMES={"弟たち":"大人になれなかった弟たちに","星の花":"星の花が降るころに","シジュウカラ":"「言葉」をもつ鳥、シジュウカラ","漢字3":"漢字に親しもう3","方言":"方言と共通語","音訓":"漢字の音訓","漢字2":"漢字に親しもう2"};
function allKanji(){return KANJI_BASE.map(a=>({u:a[0],k:a[1],r:a[2],h:a[3]})).concat(S.extraKanji).map(o=>Object.assign({id:o.u+"|"+o.k},o));}
function units(){const u=[];allKanji().forEach(o=>{if(!u.includes(o.u))u.push(o.u)});return u;}
function unitOn(u){return S.units[u]!==false;}
function allRev(){return REVENGE_BASE.concat(S.extraRev);}
function isWeekend(){const d=new Date().getDay();return d===0||d===6;}
function ensureDaily(){if(S.daily.date!==today()){S.daily={date:today(),kanjiDone:false,kijDone:false,queue:null,tsuId:null};save();}}
function markDay(){if(S.daily.kanjiDone&&S.daily.kijDone&&!S.days.includes(today())){S.days.push(today());S.days=S.days.slice(-120);save();}}
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days.includes(k)){n++;d.setDate(d.getDate()-1);}else if(n===0&&k===today()){d.setDate(d.getDate()-1);}else break;}return n;}
function genko(text,max){
  const ch=[...String(text).replace(/\n/g,"")];
  const per=10;const need=Math.max(max||0,ch.length,10);const cols=Math.ceil(need/per);
  let h='<div class="genko-wrap"><div class="genko">';
  for(let c=0;c<cols;c++){h+='<div class="gcol">';for(let r=0;r<per;r++){const i=c*per+r;const over=max&&i>=max&&i<ch.length;const lim=max&&i===max-1;h+=`<div class="gcell${over?" over":""}${lim?" limit":""}">${ch[i]?esc(ch[i]):""}</div>`;}h+=`<div class="gnum">${(c+1)*per}</div></div>`;}
  return h+"</div></div>";
}
function count(t){return [...String(t).replace(/\n/g,"")].length;}
function maru(el){const d=document.createElement("div");d.className="maru";d.innerHTML='<svg viewBox="0 0 200 200" width="180" height="180"><circle cx="100" cy="100" r="80" transform="rotate(-100 100 100)"/></svg>';el.appendChild(d);setTimeout(()=>d.remove(),1400);}
function head(back){return `<header class="top">${back?'<button class="back" onclick="home()">← もどる</button>':'<h1 class="logo">国語学習サポート</h1>'}${trialOn()?'<span class="trialtag">おためし</span>':''}<span class="date">${new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"})}</span></header>`;}

/* ---------- HOME ---------- */
function home(){
  ensureDaily();
  const st=streak();
  $("#app").innerHTML=head(false)+`
  <button class="item" style="margin:0 0 16px;justify-content:space-between" onclick="rangeView()"><span><b>期末テストまで${daysLeft()>0?"あと"+daysLeft()+"日":daysLeft()===0?"今日":"終了"}</b><small style="display:block;color:var(--pencil)">テスト範囲を見わたす・自分の計画</small></span><span style="font-size:20px">→</span></button>
  <h2>今日のメニュー</h2>
  <div class="menu">
    <button class="task${S.daily.kanjiDone?" done":""}" onclick="startKanji(false)"><span class="num">${S.daily.kanjiDone?"○":"一"}</span><span><span class="t">漢字 5問</span><span class="s">${S.daily.kanjiDone?"今日の分はできた。もう5問やってもいい":"紙に書いて、自分で丸つけ"}</span></span></button>
    <button class="task${S.daily.kijDone?" done":""}" onclick="startTsu()"><span class="num">${S.daily.kijDone?"○":"二"}</span><span><span class="t">言葉を紡ぐ（記述 1問）</span><span class="s">${S.daily.kijDone?"今日の分はできた":esc(tsuSub())}</span></span></button>
  </div>
  <h3>${isWeekend()?"週末にやること":"週末用"}</h3>
  <div class="sub">
    <button class="subbtn" onclick="revList()"><b>ワークの見直し</b><span>赤で直した記述を、答えをかくして書き直す</span></button>
    <button class="subbtn" onclick="bunsetsu()"><b>文節チェック</b><span>文を文節に区切る</span></button>
    <button class="subbtn" onclick="gramMenu()"><b>文の組み立てラボ</b><span>主語・述語、修飾…ワークP83〜86の前に</span></button>
    <button class="subbtn" onclick="quizMenu()"><b>確認ドリル</b><span>書く・方言・漢字の音訓・漢字に親しもう2</span></button>
  </div>
  <p class="streak">${st?`毎日の2つを続けた日：${st}日`:"漢字と言葉を紡ぐの2つで、今日の分は完了"}</p><p style="font-size:13px;color:var(--pencil);margin:4px 0 0">言葉を紡ぐは、教科書とノートを手元に置いてやろう。</p>
  <div class="foot"><button onclick="settings()">習った教材・問題の追加</button><button onclick="tsuList()">言葉を紡ぐの問い一覧</button></div>
  <button id="trialBtn" class="trialbtn${trialOn()?" on":""}">${trialLabel()}</button>`;
  bindTrial($("#trialBtn"));
  window.scrollTo(0,0);
}

/* ---------- KANJI ---------- */
let KQ=null;
function buildQueue(){
  const t=today();const items=allKanji().filter(o=>unitOn(o.u));
  const due=items.filter(o=>S.kanji[o.id]&&S.kanji[o.id].due<=t).sort((a,b)=>S.kanji[a.id].due<S.kanji[b.id].due?-1:1);
  const fresh0=items.filter(o=>!S.kanji[o.id]);const byU={};fresh0.forEach(o=>(byU[o.u]=byU[o.u]||[]).push(o));const fresh=[];const ul=Object.values(byU);for(let r=0;fresh.length<fresh0.length;r++)ul.forEach(a=>{if(a[r])fresh.push(a[r]);});
  return due.concat(fresh).slice(0,5).map(o=>({id:o.id,dir:Math.random()<.65?"w":"r"}));
}
function startKanji(extra){
  ensureDaily();
  let q;
  if(!extra&&!S.daily.kanjiDone&&S.daily.queue){q=S.daily.queue;}
  else{q=buildQueue();if(!extra&&!S.daily.kanjiDone){S.daily.queue=q;save();}}
  if(S.daily.kanjiDone&&!extra){q=buildQueue();extra=true;}
  if(!q.length){$("#app").innerHTML=head(true)+`<div class="card"><p>いま出せる漢字がありません。</p><p>次の復習の日まで待つか、「習った教材・問題の追加」で教材をふやしてください。</p></div>`;return;}
  KQ={q,i:0,res:[],extra};kanjiCard(false);
}
function kanjiCard(open){

function kanjiProgress(){

/* ---------- 言葉を紡ぐ ---------- */
const STEPS={1:["問い","根拠","言いかえ","つなぐ","書く"],2:["問い","根拠","言いかえ","書く"],3:["問い","書く"]};
const LVNAME={1:"段階1　カードで組み立てる",2:"段階2　カードなしで書く",3:"段階3　問いだけで書く"};
let T=null;
function tsuState(id){return S.tsu[id]||{lv:1,done:false,hist:[]};}
function tsuItems(){const on=TSUMUGU.filter(t=>unitOn(t.unit));return on.length?on:TSUMUGU;}
function pickTsu(){
  ensureDaily();
  if(S.daily.tsuId&&TSUMUGU.find(t=>t.id===S.daily.tsuId))return S.daily.tsuId;
  const items=tsuItems();const open=items.filter(t=>!tsuState(t.id).done);
  let pick;
  if(open.length){const m=Math.min(...open.map(t=>tsuState(t.id).lv));pick=open.find(t=>tsuState(t.id).lv===m);}
  else{pick=items.slice().sort((a,b)=>{const x=tsuState(a.id).hist.slice(-1)[0],y=tsuState(b.id).hist.slice(-1)[0];return (x?x.d:"")<(y?y.d:"")?-1:1;})[0];}
  S.daily.tsuId=pick.id;save();return pick.id;
}
function tsuSub(){const t=TSUMUGU.find(x=>x.id===pickTsu());const s=tsuState(t.id);return `「${t.title}」　${s.done?"復習":"段階"+s.lv}`;}
function lvDots(s){return `<span class="lvdots">${[1,2,3].map(i=>`<i class="${s.done||i<s.lv?"on":""}"></i>`).join("")}</span>`;}
function startTsu(id){
  const it=TSUMUGU.find(t=>t.id===(id||pickTsu()));const s=tsuState(it.id);
  if(!INTRO_SKIP&&!(S.intro&&S.intro[it.unit])){const after=id||"daily";return it.unit==="星の花"?curveStart(after):it.unit==="シジュウカラ"?smapStart(after):timelineStart(after);}
  INTRO_SKIP=false;
  T={it,lv:s.done?3:s.lv,si:0,daily:!id||id===S.daily.tsuId,end:null,sel:[],evChecked:false,ii:0,iiPick:null,built:[],pool:null,buildOk:false,shown:false,t0:Date.now(),fails:0};
  T.pool=shuffle(it.cards.concat(it.decoy).map((c,i)=>({c,i})));
  tsuRender();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tsuNext(){T.si++;tsuRender();window.scrollTo(0,0);}
function tsuRender(){
  const it=T.it;const steps=STEPS[T.lv];const step=steps[T.si];
  let h=head(true)+`<div class="stepname">${steps.map((s,i)=>`<span class="${i<=T.si?"on":""}">${s}</span>`).join("")}</div><div class="card" id="tc">`;
  h+=`<div class="unit">${esc(UNIT_NAMES[it.unit]||it.unit)}　${LVNAME[T.lv]}</div>`;
  if(step==="問い"){
    h+=`<div class="ref">教科書 <b>p.${esc(it.page)}　${esc(it.lines)}</b> を読んでから始めよう。</div><p class="q">${esc(it.q)}</p>
    <p style="font-weight:700;margin-bottom:8px">この問いの答えは、どんな形で終わる？</p>
    ${Object.keys(ENDS).map(k=>`<button class="opt${T.end===k?(k===it.end?" ok":" ng"):""}" onclick="T.end='${k}';tsuRender()">${ENDS[k].label}</button>`).join("")}`;
    if(T.end===it.end)h+=`<div class="note">答えは「${ENDS[it.end].label}」で終わる。字数は${it.max}字以内。問いの最後の言葉が、答えの終わり方を決めている。</div><div class="row"><button class="btn" onclick="tsuNext()">次へ</button></div>`;
    else if(T.end)h+=`<div class="note red">問いの最後の言葉をもう一度見てみよう。</div>`;
  }else if(step==="根拠"){
    h+=`<p class="q">${esc(it.q)}</p><p style="font-size:15px">教科書p.${esc(it.page)}を読んで、答えの<b>根拠</b>になるものを<b>すべて</b>選ぼう。</p>`;
    it.ev.forEach((e,i)=>{let c="evc";let note="";
      if(T.evChecked){if(e.ok&&T.sel.includes(i))c+=" good";else if(e.ok)c+=" missed";else if(T.sel.includes(i))c+=" bad";note=`<small>${e.ok?"根拠になる：":"根拠にならない："}${esc(e.why)}</small>`;}
      else if(T.sel.includes(i))c+=" sel";
      h+=`<button class="${c}" onclick="tsuEv(${i})">${T.evChecked?(e.ok?"✓ ":"✗ "):""}${esc(e.t)}${note}</button>`;});
    if(!T.evChecked)h+=`<div class="row"><button class="btn" ${T.sel.length?"":"disabled"} onclick="T.evChecked=true;tsuRender()">確かめる</button></div>`;
    else{const miss=it.ev.filter((e,i)=>e.ok&&!T.sel.includes(i)).length,bad=it.ev.filter((e,i)=>!e.ok&&T.sel.includes(i)).length;
      h+=`<div class="note${miss||bad?" red":""}">${!miss&&!bad?"根拠をぴったり選べた。":"点線のものは見落とした根拠、赤いものは根拠にならないもの。理由を読んでおこう。"}</div><div class="row"><button class="btn" onclick="tsuNext()">次へ</button></div>`;}
  }else if(step==="言いかえ"){
    const q=it.iikae[T.ii];
    h+=`<p style="font-size:15px;color:var(--pencil)">本文の行動や様子を、気持ちや意味の言葉に言いかえる。（${T.ii+1}/${it.iikae.length}）</p><p class="q">${esc(q.q)}</p>`;
    q.opts.forEach((o,i)=>{let c="opt";if(T.iiPick!==null){if(i===q.a)c+=" ok";else if(i===T.iiPick)c+=" ng";}h+=`<button class="${c}" onclick="tsuIi(${i})">${esc(o)}</button>`;});
    if(T.iiPick!==null){h+=`<div class="note${T.iiPick===q.a?"":" red"}">${T.iiPick===q.a?"そのとおり。":"答えは緑のもの。"}${esc(q.why)}</div><div class="row"><button class="btn" onclick="tsuIiNext()">次へ</button></div>`;}
  }else if(step==="つなぐ"){
    const text=T.built.map(i=>T.pool[i].c).join("");
    h+=`<p class="q">${esc(it.q)}</p><p style="font-size:15px">拾った根拠と言いかえた言葉をつないで、答えを組み立てよう。<b>使わないカードが1枚</b>まざっている。</p>
    <div class="built">${T.built.map((pi,k)=>`<button class="wcard${T.wrongAt===k?" wrong":""}" onclick="tsuUnbuild(${k})">${esc(T.pool[pi].c)}</button>`).join("")||'<span style="color:var(--pencil);font-size:14px;padding:6px">下のカードをタップして並べる</span>'}</div>
    <div class="pool">${T.pool.map((p,i)=>`<button class="wcard${T.built.includes(i)?" used":""}" onclick="tsuBuild(${i})">${esc(p.c)}</button>`).join("")}</div>
    ${genko(text,it.max)}`;
    if(T.buildOk)h+=`<div class="note">つながった。次はこの答えを、見ないでノートに書く。</div><div class="row"><button class="btn" onclick="tsuNext()">次へ</button></div>`;
    else{if(T.buildMsg)h+=`<div class="note red">${T.buildMsg}</div>`;h+=`<div class="row"><button class="btn" ${T.built.length?"":"disabled"} onclick="tsuCheckBuild()">確かめる</button></div>`;}
  }else if(step==="書く"){
    const model=it.cards.join("");
    if(!T.shown){
      h+=`${T.lv===3?`<div class="ref">教科書 <b>p.${esc(it.page)}　${esc(it.lines)}</b> を読み、根拠に線を引いてから書こう。</div>`:""}<p class="q">${esc(it.q)}</p>
      <p style="font-size:15px">${T.lv===1?"さっき組み立てた答えを、画面を見ないでノートに書こう。":T.lv===2?"拾った根拠と言いかえた言葉を使って、ノートに自分で書こう。":"ノートに書こう。"}答えは「<b>${ENDS[it.end].label}</b>」で終わる。<b>${it.max}字以内</b>。</p>
      ${genko("",it.max)}
      <div class="row"><button class="btn" onclick="T.shown=true;tsuRender()">書けたら答えの例を見る</button></div>`;
    }else{
      h+=`<p class="q">${esc(it.q)}</p><h3 style="margin-top:0">答えの例</h3>${genko(model,it.max)}

      ${it.points.map((p,i)=>`<label class="checkline"><input type="checkbox">${esc(p)}</label>`).join("")}

    }

function tsuEv(i){if(T.evChecked)return;T.sel=T.sel.includes(i)?T.sel.filter(x=>x!==i):T.sel.concat(i);tsuRender();}
function tsuIi(i){if(T.iiPick!==null)return;T.iiPick=i;tsuRender();}
function tsuIiNext(){T.iiPick=null;if(T.ii<T.it.iikae.length-1){T.ii++;tsuRender();}else tsuNext();}
function tsuBuild(i){if(T.buildOk||T.built.includes(i))return;T.built.push(i);T.wrongAt=null;T.buildMsg="";tsuRender();}
function tsuUnbuild(k){if(T.buildOk)return;T.built.splice(k,1);T.wrongAt=null;T.buildMsg="";tsuRender();}
function tsuCheckBuild(){
  const it=T.it;const seq=T.built.map(i=>T.pool[i].c);
  if(seq.join("")===it.cards.join("")){T.buildOk=true;tsuRender();maru($("#tc"));return;}
  T.fails++;
  const d=seq.findIndex(c=>it.decoy.includes(c));
  if(d>=0){T.wrongAt=d;T.buildMsg="赤いカードは、この答えには使わない。根拠と言いかえを思い出そう。";}
  else if(seq.length<it.cards.length){T.wrongAt=null;T.buildMsg="まだカードが足りない。";}
  else{const k=seq.findIndex((c,j)=>c!==it.cards[j]);T.wrongAt=k;T.buildMsg=k===seq.length-1||seq[seq.length-1]!==it.cards[it.cards.length-1]?`答えの最後は「${ENDS[it.end].label}」の形になるカード。`:"赤いカードから、順番を見直そう。";}
  tsuRender();
}
function tsuEval(m){

  s.hist.push({d:today(),lv,res:m,sec:Math.round((Date.now()-T.t0)/1000),tries:lv===1?T.fails:null});s.hist=s.hist.slice(-20);

  setTimeout(()=>{$("#app").innerHTML=head(true)+`<div class="card" style="text-align:center"><div class="big" style="color:var(--red)">${m}</div><p>${msg}</p><div class="row"><button class="btn" onclick="home()">メニューへ</button></div></div>`;},m==="○"?700:100);

function gramAll(){const a=[];GRAM.forEach(t=>t.items.forEach(it=>a.push(Object.assign({topic:t.name},it))));return a;}
function gramMenu(){S.gram=S.gram||{};
  $("#app").innerHTML=head(true)+`<h2>文の組み立てラボ</h2><p style="font-size:15px">文法への扉2。上から順に。一つ終わったら、そのワークのページをやろう。</p>
  <div class="list">${GRAM.map((t,ti)=>{const n=t.items.length,done=t.items.filter(i=>S.gram[i.id]).length,ok=t.items.filter(i=>S.gram[i.id]&&S.gram[i.id].ok).length;
    return `<button class="item" onclick="gramStart(${ti})"><span class="mk${done?"":" none"}">${done===n?(ok===n?"○":"△"):"・"}</span><span>${ti+1}．${esc(t.name)}<small>${done?`${ok}/${n}問 一回で正解`:"まだ"}　→ ${esc(t.work)}</small></span></button>`;}).join("")}</div>`;
  window.scrollTo(0,0);
}
function gramStart(ti){G={ti,ii:-1,si:0,marks:[],checked:false,pick:null,first:true};gramRender();}
function gramRender(){
  const t=GRAM[G.ti];let h=head(true);
  if(G.ii<0){
    h+=`<h2>${G.ti+1}．${esc(t.name)}</h2><div class="card"><div class="unit">まず、ここだけ読もう</div>${t.sum.map(x=>`<p style="margin:8px 0">${esc(x)}</p>`).join("")}
    <div class="row"><button class="btn" onclick="G.ii=0;gramRender()">問題へ（${t.items.length}問）</button></div></div>`;
    $("#app").innerHTML=h;window.scrollTo(0,0);return;
  }
  if(G.ii>=t.items.length){
    const ok=t.items.filter(i=>S.gram[i.id]&&S.gram[i.id].ok).length;
    h+=`<div class="card" style="text-align:center"><div class="big">${ok} / ${t.items.length}</div><p>一回で正解した数。</p><div class="note" style="text-align:left">紙でも確かめよう：<b>${esc(t.work)}</b></div>
    <div class="row">${G.ti<GRAM.length-1?`<button class="btn line" onclick="gramStart(${G.ti+1})">次の項目へ</button>`:""}<button class="btn" onclick="gramMenu()">一覧へ</button></div></div>`;
    $("#app").innerHTML=h;return;
  }
  const it=t.items[G.ii];const toks=it.s.split("/");
  h+=`<div class="card" id="gc"><div class="unit">${esc(t.name)}　${G.ii+1} / ${t.items.length}</div>`;
  if(it.steps){
    const st=it.steps[G.si];const multi=it.multi||st.a.length>1;
    h+=`<p class="q">${esc(st.p)}${multi?"（いくつかある）":""}</p><div class="gsent">${toks.map((w,i)=>{let c="gchip";
      if((it.hi||[]).includes(i))c+=" hi";
      if(G.checked){if(st.a.includes(i))c+=G.marks.includes(i)?" good":" miss";else if(G.marks.includes(i))c+=" bad";}
      else if(G.marks.includes(i))c+=" sel";
      return `<button class="${c}" onclick="gramTap(${i},${multi})">${esc(w)}</button>`;}).join("")}</div>`;
    if(!G.checked)h+=`<div class="row"><button class="btn" ${G.marks.length?"":"disabled"} onclick="gramCheck()">確かめる</button></div>`;
    else{const ok=gramStepOk(st);h+=`<div class="note${ok?"":" red"}">${ok?"正解。":"正しいのは緑の文節：「"+st.a.map(i=>toks[i]).join("").replace(/[。、]$/,"")+"」。"}${G.si===it.steps.length-1?"<br>"+esc(it.tip):""}</div><div class="row"><button class="btn" onclick="gramNext()">次へ</button></div>`;}
  }else{
    h+=`<div class="gsent">${toks.map((w,i)=>`<span class="gchip static${(it.hi||[]).includes(i)?" hi":""}">${esc(w)}</span>`).join("")}</div><p class="q">${esc(it.q)}</p>
    ${it.opts.map((o,i)=>{let c="opt";if(G.pick!==null){if(i===it.a)c+=" ok";else if(i===G.pick)c+=" ng";}return `<button class="${c}" onclick="gramPick(${i})">${esc(o)}</button>`;}).join("")}`;
    if(G.pick!==null)h+=`<div class="note${G.pick===it.a?"":" red"}">${G.pick===it.a?"正解。":"答えは緑のもの。"}${esc(it.tip)}</div><div class="row"><button class="btn" onclick="gramNext()">次へ</button></div>`;
  }
  $("#app").innerHTML=h+`</div>`;
}
function gramStepOk(st){return G.marks.length===st.a.length&&st.a.every(i=>G.marks.includes(i));}
function gramTap(i,multi){if(G.checked)return;if(multi)G.marks=G.marks.includes(i)?G.marks.filter(x=>x!==i):G.marks.concat(i);else G.marks=G.marks[0]===i?[]:[i];gramRender();}
function gramCheck(){const it=GRAM[G.ti].items[G.ii];const ok=gramStepOk(it.steps[G.si]);G.checked=true;if(!ok)G.first=false;
  if(G.si===it.steps.length-1)gramSave(it,G.first);gramRender();if(ok)maru($("#gc"));}
function gramPick(i){if(G.pick!==null)return;const it=GRAM[G.ti].items[G.ii];G.pick=i;gramSave(it,i===it.a);gramRender();if(i===it.a)maru($("#gc"));}
function gramSave(it,ok){S.gram=S.gram||{};const p=S.gram[it.id];S.gram[it.id]={ok,d:today(),n:(p?p.n:0)+1};save();}
function gramNext(){const it=GRAM[G.ti].items[G.ii];
  if(it.steps&&G.si<it.steps.length-1){G.si++;G.marks=[];G.checked=false;gramRender();return;}
  G.ii++;G.si=0;G.marks=[];G.checked=false;G.pick=null;G.first=true;gramRender();window.scrollTo(0,0);}
function gramAnswer(it){const toks=it.s.split("/");if(it.steps)return it.steps.map(st=>st.p.replace(/をタップ.*$|になる文節を全部タップ|を全部タップ/,"")+"："+st.a.map(i=>toks[i]).join("").replace(/[。、]$/,"")).join("／");return it.opts[it.a];}

function daysLeft(){const a=new Date(TEST_DAY+"T00:00:00"),b=new Date(today()+"T00:00:00");return Math.round((a-b)/86400000);}
function bar(n,m){const r=m?Math.round(n/m*100):0;return `<div style="height:8px;background:var(--grid-soft);border-radius:4px;overflow:hidden;margin:4px 0 2px"><div style="width:${r}%;height:100%;background:var(--grid)"></div></div>`;}
function kanjiStat(u){const it=allKanji().filter(o=>o.u===u);const two=it.filter(o=>S.kanji[o.id]&&S.kanji[o.id].lv>=2).length;const seen=it.filter(o=>S.kanji[o.id]).length;return {n:it.length,two,seen};}
function tsuStat(u){const it=TSUMUGU.filter(t=>t.unit===u);const st=it.map(t=>tsuState(t.id));return {n:it.length,s1:st.filter(s=>s.done||s.lv>=2).length,s2:st.filter(s=>s.done||s.lv>=3).length,done:st.filter(s=>s.done).length};}
function revStat(u){const it=allRev().filter(r=>r.u===u);return {n:it.length,ok:it.filter(r=>S.rev[r.id]&&S.rev[r.id].res==="○").length,done:it.filter(r=>S.rev[r.id]).length};}
function rangeRow(label,st,go){return `<button class="item" style="display:block;margin-bottom:6px" onclick="${go}"><span style="display:flex;justify-content:space-between;font-size:15px"><span>${label}</span><b>${st}</b></span>${arguments[3]||""}</button>`;}

    if(map)h+=rangeRow(mapName,S.intro&&S.intro[u]?"○":"まだ",map);
    if(t.n)h+=rangeRow("言葉を紡ぐ（段階1が終わった問い）",`${t.s1}/${t.n}`,"tsuList()",bar(t.s1,t.n)+`<small style="color:var(--pencil)">段階2まで終わった ${t.s2}・問いだけで書ける ${t.done}</small>`);
    if(r.n)h+=rangeRow("ワークの見直し（○）",`${r.ok}/${r.n}`,"revList()",bar(r.ok,r.n));
    if(k.n)h+=rangeRow("漢字（2回以上書けた）",`${k.two}/${k.n}`,"startKanji(true)",bar(k.two,k.n)+`<small style="color:var(--pencil)">一度出た ${k.seen}</small>`);
    return h+`</div>`;};
  S.gram=S.gram||{};const ga=gramAll();const gok=ga.filter(i=>S.gram[i.id]&&S.gram[i.id].ok).length,gdone=ga.filter(i=>S.gram[i.id]).length;
  const bun=Object.values(S.bun).filter(Boolean).length;
  let h=head(true)+`<h2>テスト範囲を見わたす</h2>
  <div class="card" style="text-align:center;margin-bottom:14px"><div style="font-size:14px;color:var(--pencil)">定期テスト③　11月19日（木）　国語は4時間目</div><div class="big" style="margin:4px 0">${d>0?"あと "+d+" 日":d===0?"今日":"おつかれさま"}</div></div>
  <h3>自分で立てた計画</h3><div class="card" style="margin-bottom:14px">${PLAN.map(p=>`<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--grid-soft)"><label class="checkline" style="flex:1;margin:0"><input type="checkbox" ${S.plan[p.id]?"checked":""} onchange="planTick('${p.id}',this.checked)">${esc(p.t)}</label><button class="btn line" style="padding:6px 10px;font-size:13px;width:auto;flex:none" onclick="${p.go}">${esc(p.goName)}</button></div>`).join("")}
  <p style="font-size:13px;color:var(--pencil);margin:8px 0 0">チェックは自分で。終わったら付けよう。</p></div>
  <h3>アプリでやる範囲</h3>
  ${unitBlock("弟たち","教科書p.97〜103","timelineStart(null)","作品の地図：年表と対比")}
  ${unitBlock("星の花","教科書p.106〜112","curveStart(null)","作品の地図：気持ちの曲線")}
  ${unitBlock("シジュウカラ","教科書p.128〜136　ワークP74〜80","smapStart(null)","構成マップ")}
  <div class="card" style="margin-bottom:14px"><div class="unit">教科書p.147・246〜250　ワークP83〜86</div><h3 style="margin:2px 0 10px">文の組み立て（文法への扉2）</h3>
  ${rangeRow("文の組み立てラボ（一回で正解）",`${gok}/${ga.length}`,"gramMenu()",bar(gok,ga.length)+`<small style="color:var(--pencil)">やった ${gdone}</small>`)}
  ${rangeRow("文節チェック（正解）",`${bun}/${BUNSETSU.length}`,"bunsetsu()",bar(bun,BUNSETSU.length))}</div>
  ${unitBlock("漢字3","教科書p.146　ワークP82")}
  ${quizBlock(0,null)}${quizBlock(1,"方言")}${quizBlock(2,"音訓")}${quizBlock(3,"漢字2")}
  <h3>紙でやる範囲</h3><div class="card" style="margin-bottom:14px">${PAPER.map(p=>`<label class="checkline" style="padding:6px 0;border-bottom:1px dashed var(--grid-soft)"><input type="checkbox" ${S.plan[p.id]?"checked":""} onchange="planTick('${p.id}',this.checked)"><span>${esc(p.t)}<small style="display:block;color:var(--pencil);font-size:12px">${esc(p.s)}</small></span></label>`).join("")}</div>
  <p style="font-size:13px;color:var(--pencil)">テスト範囲：ワークP52〜86、漢字ドリルP24〜33</p>`;
  $("#app").innerHTML=h;window.scrollTo(0,0);
}
function quizBlock(ti,u){S.quiz=S.quiz||{};const t=QUIZ[ti];const n=t.items.length,ok=t.items.filter(i=>S.quiz[i.id]&&S.quiz[i.id].ok).length,done=t.items.filter(i=>S.quiz[i.id]).length;
  let h=`<div class="card" style="margin-bottom:14px"><div class="unit">${esc(t.src)}　${esc(t.work)}</div><h3 style="margin:2px 0 10px">${esc(t.name)}</h3>`+rangeRow("確認ドリル（正解）",`${ok}/${n}`,`quizStart(${ti})`,bar(ok,n)+`<small style="color:var(--pencil)">やった ${done}</small>`);
  if(u){const k=kanjiStat(u);h+=rangeRow("漢字（2回以上書けた）",`${k.two}/${k.n}`,"startKanji(true)",bar(k.two,k.n)+`<small style="color:var(--pencil)">一度出た ${k.seen}</small>`);}
  return h+`</div>`;}
function planTick(id,on){S.plan=S.plan||{};if(on)S.plan[id]=today();else delete S.plan[id];save();}


/* ---------- 確認ドリル ---------- */
let QZ=null;
function quizAll(){const a=[];QUIZ.forEach(t=>t.items.forEach(it=>a.push(Object.assign({set:t.name},it))));return a;}
function quizMenu(){S.quiz=S.quiz||{};
  $("#app").innerHTML=head(true)+`<h2>確認ドリル</h2><p style="font-size:15px">書く・方言と共通語・漢字の音訓・漢字に親しもう2。その場で丸つけ。</p>
  <div class="list">${QUIZ.map((t,ti)=>{const n=t.items.length,done=t.items.filter(i=>S.quiz[i.id]).length,ok=t.items.filter(i=>S.quiz[i.id]&&S.quiz[i.id].ok).length;
    return `<button class="item" onclick="quizStart(${ti})"><span class="mk${done?"":" none"}">${done===n?(ok===n?"○":"△"):"・"}</span><span>${esc(t.name)}<small>${esc(t.src)}　${done?`${ok}/${n}問 一回で正解`:"まだ"}</small></span></button>`;}).join("")}</div>`;
  window.scrollTo(0,0);
}
function quizStart(ti){QZ={ti,ii:-1,pick:null,order:null,miss:false};quizRender();}
function quizRender(){
  const t=QUIZ[QZ.ti];let h=head(true);
  if(QZ.ii<0){h+=`<h2>${esc(t.name)}</h2><div class="card"><div class="unit">まず、ここだけ読もう　${esc(t.src)}</div>${t.sum.map(x=>`<p style="margin:8px 0">${esc(x)}</p>`).join("")}
    <div class="row"><button class="btn line" onclick="quizGo(true)">まちがえた問題だけ</button><button class="btn" onclick="quizGo(false)">全部（${t.items.length}問）</button></div></div>`;$("#app").innerHTML=h;window.scrollTo(0,0);return;}
  const list=QZ.list;
  if(QZ.ii>=list.length){const ok=list.filter(i=>S.quiz[i.id]&&S.quiz[i.id].ok).length;
    h+=`<div class="card" style="text-align:center"><div class="big">${ok} / ${list.length}</div><p>正解した数。</p><div class="note" style="text-align:left">紙でも確かめよう：<b>${esc(t.work)}</b></div>
    <div class="row"><button class="btn line" onclick="quizStart(${QZ.ti})">もう一度</button><button class="btn" onclick="quizMenu()">一覧へ</button></div></div>`;$("#app").innerHTML=h;return;}
  const it=list[QZ.ii];if(!QZ.order)QZ.order=shuffle(it.opts.map((_,i)=>i));
  h+=`<div class="card" id="qc"><div class="unit">${esc(t.name)}　${QZ.ii+1} / ${list.length}</div><p class="q">${esc(it.q)}</p>
  ${QZ.order.map(i=>{let c="opt";if(QZ.pick!==null){if(i===it.a)c+=" ok";else if(i===QZ.pick)c+=" ng";}return `<button class="${c}" onclick="quizPick(${i})">${esc(it.opts[i])}</button>`;}).join("")}`;
  if(QZ.pick!==null)h+=`<div class="note${QZ.pick===it.a?"":" red"}">${QZ.pick===it.a?"正解。":"答えは緑のもの。"}${esc(it.tip)}</div><div class="row"><button class="btn" onclick="quizNext()">次へ</button></div>`;
  $("#app").innerHTML=h+`</div>`;
}
function quizGo(missOnly){const t=QUIZ[QZ.ti];S.quiz=S.quiz||{};let l=t.items;if(missOnly){l=t.items.filter(i=>!S.quiz[i.id]||!S.quiz[i.id].ok);if(!l.length){alert("まちがえた問題はありません。");return;}}QZ.list=l;QZ.ii=0;QZ.pick=null;QZ.order=null;quizRender();}
function quizPick(i){if(QZ.pick!==null)return;const it=QZ.list[QZ.ii];QZ.pick=i;S.quiz=S.quiz||{};const p=S.quiz[it.id];S.quiz[it.id]={ok:i===it.a,d:today(),n:(p?p.n:0)+1};save();quizRender();if(i===it.a)maru($("#qc"));}
function quizNext(){QZ.ii++;QZ.pick=null;QZ.order=null;quizRender();window.scrollTo(0,0);}

const LOG_URL="https://script.google.com/macros/s/AKfycby7lhyy9WtCE4ZqU48sLYJ5OGirOocbhPnfH7L4TtfZszQ1Hcnem2svJ_70vkvsJDRx/exec";
const LOG_KEY="Pphha1TEbK66QTPT";
function syncRows(){
  const t=today();const md=d=>d?(+d.slice(5,7))+"/"+(+d.slice(8)):"";
  const W=[["単元","問い","今の段階","やった回数","結果の流れ（かかった時間・並べ直し）","最後にやった日"]];
  TSUMUGU.forEach(it=>{const st=S.tsu[it.id];const u=UNIT_NAMES[it.unit]||it.unit;
    if(!st||!st.hist||!st.hist.length){W.push([u,it.title,"まだ",0,"",""]);return;}
    W.push([u,it.title,st.done?"段階3まで完了":"段階"+st.lv,st.hist.length,st.hist.map(h=>md(h.d)+" 段階"+h.lv+" "+h.res+tsuMeta(h)).join(" → "),md(st.hist[st.hist.length-1].d)]);});
  const KL={0:"まちがえた",1:"書けた（1回）",2:"書けた（2回）",3:"書けた（3回以上）"};
  const K=[["単元","漢字","読み","今の状態","次に出る日","最近の記録（日付・結果・答えを見るまでの時間）"]];
  allKanji().forEach(o=>{const st=S.kanji[o.id];const u=UNIT_NAMES[o.u]||o.u;
    if(!st||st.lv<0){K.push([u,o.k,o.r,"まだ出ていない",""]);return;}
    K.push([u,o.k,o.r,KL[st.lv]||"",st.due?md(st.due)+(st.due<t?"（期限切れ）":""):"",(st.h||[]).map(x=>md(x[0])+" "+(x[1]?"○":"×")+(x[2]==null?"":" "+secTxt(x[2]))).join(" / ")]);});
  const R=[["単元","ワークのページ","設問","やった日","結果","書いた答え"]];
  allRev().forEach(r=>{const st=S.rev[r.id];R.push([r.u,r.p,r.q,st?md(st.date):"",st?st.res:"まだ",st?st.ans:""]);});
  S.plan=S.plan||{};PLAN.concat(PAPER).forEach(x=>R.push(["自分の計画","",x.t,S.plan[x.id]?md(S.plan[x.id]):"",S.plan[x.id]?"済":"",""]));
  const B=[["番号","文","結果","正しい区切り・答え"]];
  BUNSETSU.forEach((b,i)=>B.push([i+1,b.s.replace(/\//g,""),(i in S.bun)?(S.bun[i]?"正解":"まちがい"):"まだ",b.s.replace(/\//g,"／")]));
  S.gram=S.gram||{};gramAll().forEach(it=>{const g=S.gram[it.id];B.push(["文法"+it.id,"【"+it.topic+"】"+it.s.replace(/\//g,""),g?(g.ok?"正解":"まちがい"):"まだ",gramAnswer(it)]);});
  S.quiz=S.quiz||{};quizAll().forEach(it=>{const g=S.quiz[it.id];B.push(["確認"+it.id,"【"+it.set+"】"+it.q,g?(g.ok?"正解":"まちがい"):"まだ",it.opts[it.a]]);});
  return {"言葉を紡ぐ":W,"漢字":K,"ワークの見直し":R,"文節チェック":B};
}
function syncScore(){let n=0;Object.values(S.tsu).forEach(t=>n+=(t.hist||[]).length);
  Object.values(S.kanji).forEach(k=>n+=1+Math.max(0,k.lv||0));return n+Object.keys(S.rev).length+Object.keys(S.bun).length+Object.keys(S.gram||{}).length+Object.keys(S.quiz||{}).length+Object.keys(S.intro||{}).length;}
function syncDevice(){try{let d=localStorage.getItem("kokugo-device");if(!d){d=(/iPhone|Android/.test(navigator.userAgent)?"スマホ-":"パソコン-")+Math.random().toString(36).slice(2,6);localStorage.setItem("kokugo-device",d);}return d;}catch(e){return "不明";}}
function secTxt(n){return n<60?n+"秒":Math.floor(n/60)+"分"+(n%60)+"秒";}
function tsuMeta(h){const a=[];if(h.sec!=null)a.push(secTxt(h.sec));if(h.tries!=null)a.push("並べ直し"+h.tries+"回");return a.length?"（"+a.join("・")+"）":"";}
let syncTimer=null;
function syncNow(){
  if(trialOn())return;
  if(!/^https:\/\/script\.google\.com\//.test(LOG_URL))return;
  try{fetch(LOG_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify({key:LOG_KEY,app:"kokugo",at:new Date().toISOString(),device:syncDevice(),score:syncScore(),sheets:syncRows(),raw:JSON.stringify(S)})}).catch(()=>{});}catch(e){}
}
function syncSoon(){clearTimeout(syncTimer);syncTimer=setTimeout(syncNow,3000);}
(function(){const _save=save;save=function(){_save();syncSoon();};})();
window.addEventListener("load",()=>setTimeout(syncNow,1500));
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&syncTimer){clearTimeout(syncTimer);syncTimer=null;syncNow();}});

/* ---------- 保護者おためしモード（記録を残さない・60分で自動オフ） ---------- */
var TRIAL_KEY="kokugo-trial-until",TRIAL_MIN=60;
function trialUntil(){try{return +localStorage.getItem(TRIAL_KEY)||0;}catch(e){return 0;}}
function trialOn(){return Date.now()<trialUntil();}
function trialLabel(){if(!trialOn())return "保護者おためしモード：オフ（2秒長押しでオン）";
  return `保護者おためしモード：オン（あと${Math.ceil((trialUntil()-Date.now())/60000)}分で自動オフ・2秒長押しでオフ）`;}
function trialReload(){S=Object.assign({kanji:{},extraKanji:[],units:{},daily:{},kij:{},tsu:{},rev:{},extraRev:[],bun:{},gram:{},plan:{},quiz:{},days:[]},load());}
function trialSet(on){try{if(on)localStorage.setItem(TRIAL_KEY,String(Date.now()+TRIAL_MIN*60000));else localStorage.removeItem(TRIAL_KEY);}catch(e){}
  trialWas=!!on;trialReload();home();}
function bindTrial(btn){if(!btn)return;let t=null;
  const down=e=>{e.preventDefault();btn.textContent="そのまま押し続けて…";t=setTimeout(()=>{t=null;trialSet(!trialOn());},2000);};
  const up=()=>{if(t){clearTimeout(t);t=null;btn.textContent=trialLabel();}};
  btn.addEventListener("pointerdown",down);["pointerup","pointerleave","pointercancel"].forEach(ev=>btn.addEventListener(ev,up));
  btn.addEventListener("contextmenu",e=>e.preventDefault());}
let trialWas=trialOn();
setInterval(()=>{const now=trialOn();if(trialWas&&!now){trialReload();home();}trialWas=now;const b=$("#trialBtn");if(b&&!b.textContent.startsWith("そのまま"))b.textContent=trialLabel();},30000);
</script>
