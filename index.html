<style>
:root{

  --grid:#4E8A69; --grid-soft:#DCE9E0; --red:#D3302F; --red-soft:#FBE3E1; --ok:#2F7D55;
  --kyo:"Klee One","Hiragino Mincho ProN","Yu Mincho",serif;
  --ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#181C1A; --sheet:#212624; --ink:#E7EAE5; --pencil:#A2A9A4;
    --grid:#71B48F; --grid-soft:#2C3832; --red:#FF6B66; --red-soft:#3A2423; --ok:#7CCB9E;
  }
}
:root[data-theme="dark"]{
  --paper:#181C1A; --sheet:#212624; --ink:#E7EAE5; --pencil:#A2A9A4;
  --grid:#71B48F; --grid-soft:#2C3832; --red:#FF6B66; --red-soft:#3A2423; --ok:#7CCB9E;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 48px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.logo{font-family:var(--kyo);font-weight:600;font-size:24px;letter-spacing:.08em;margin:0;display:flex;align-items:center;gap:10px}
.logo .box{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--grid);color:var(--red);font-size:24px}
.back{background:none;border:none;color:var(--pencil);padding:6px 0;font-size:15px}
.date{color:var(--pencil);font-size:14px}
h2{font-family:var(--kyo);font-weight:600;font-size:22px;margin:4px 0 12px}
h3{font-size:15px;font-weight:700;margin:20px 0 8px;color:var(--pencil)}
p{margin:0 0 12px}
.menu{display:grid;gap:12px}
.task{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:16px}
.task:hover{border-color:var(--grid)}
.task .num{font-family:var(--kyo);font-size:30px;width:52px;height:52px;flex:none;display:grid;place-items:center;border:2px solid var(--grid);color:var(--grid)}
.task .t{font-weight:700;font-size:17px;display:block}
.task .s{color:var(--pencil);font-size:14px}
.task.done .num{border-color:var(--red);color:var(--red)}
.sub{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.subbtn{background:none;border:1.5px dashed var(--grid-soft);border-radius:6px;padding:12px;text-align:left}
.subbtn b{display:block;font-size:15px}
.subbtn span{font-size:13px;color:var(--pencil)}
.streak{margin:18px 0 0;color:var(--pencil);font-size:14px}
.card{background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:20px;position:relative}
.big{font-family:var(--kyo);font-size:44px;line-height:1.3;text-align:center;margin:8px 0;letter-spacing:.06em}
.phrase{font-family:var(--kyo);font-size:20px;text-align:center;color:var(--pencil)}
.phrase em{font-style:normal;color:var(--ink);border-bottom:2px solid var(--grid)}
.unit{font-size:13px;color:var(--pencil)}
.row{display:flex;gap:10px;margin-top:16px}
.btn{flex:1;border:none;border-radius:6px;padding:14px;font-weight:700;font-size:16px;background:var(--grid);color:#fff}
.btn.line{background:none;border:1.5px solid var(--grid);color:var(--grid)}
.btn.red{background:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
.dots{display:flex;gap:6px;justify-content:center;margin:0 0 14px}
.dots i{width:10px;height:10px;border:1.5px solid var(--grid);border-radius:50%}
.dots i.on{background:var(--grid)}
.dots i.ng{background:var(--red);border-color:var(--red)}
.maru{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.maru circle{fill:none;stroke:var(--red);stroke-width:7;stroke-linecap:round;stroke-dasharray:600;stroke-dashoffset:600;animation:draw .55s ease-out forwards;opacity:.85}
@keyframes draw{to{stroke-dashoffset:40}}
@media (prefers-reduced-motion:reduce){.maru circle{animation:none;stroke-dashoffset:40}}
.steps{display:flex;gap:6px;margin-bottom:14px}
.steps span{flex:1;height:4px;background:var(--grid-soft);border-radius:2px}
.steps span.on{background:var(--grid)}
.q{font-family:var(--kyo);font-size:18px;line-height:1.8;border-left:4px solid var(--grid);padding:2px 0 2px 12px;margin:0 0 14px}
.passage{font-family:var(--kyo);font-size:18px;line-height:2}
.sent{display:inline;border-radius:3px;padding:1px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.sent.sel{background:var(--grid-soft);box-shadow:inset 0 -2px 0 var(--grid)}
.sent.right{background:var(--grid-soft);box-shadow:inset 0 -3px 0 var(--ok)}
.sent.miss{box-shadow:inset 0 -3px 0 var(--red)}
.sent.wrong{background:var(--red-soft)}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{border:1.5px solid var(--grid-soft);background:var(--sheet);border-radius:6px;padding:14px;font-size:17px;font-weight:700}
.choice.ok{border-color:var(--ok);color:var(--ok)}
.choice.ng{border-color:var(--red);color:var(--red)}
.note{background:var(--grid-soft);border-radius:6px;padding:12px 14px;font-size:15px;margin-top:14px}
.note.red{background:var(--red-soft)}
.frame{font-family:var(--kyo);font-size:17px;padding:10px 12px;border:1.5px dashed var(--grid);border-radius:6px;margin:0 0 12px}
textarea,input,select{width:100%;font-family:var(--kyo);font-size:18px;background:var(--sheet);color:var(--ink);border:1.5px solid var(--grid-soft);border-radius:6px;padding:10px 12px}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:14px;color:var(--pencil);margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{font-size:13px;padding:4px 10px;border-radius:99px;border:1.5px solid var(--grid-soft);color:var(--pencil)}
.chip.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.chip.ng{border-color:var(--red);color:var(--red)}
.genko-wrap{overflow-x:auto;margin:6px 0 4px;padding-bottom:4px}
.genko{display:flex;direction:rtl;gap:0;width:max-content;margin-left:auto;border:1.5px solid var(--grid)}
.gcol{direction:ltr;display:flex;flex-direction:column;border-left:1px solid var(--grid)}
.gcol:last-child{border-left:none}
.gcell{width:30px;height:30px;border-bottom:1px solid var(--grid-soft);display:grid;place-items:center;font-family:var(--kyo);font-size:19px;writing-mode:vertical-rl;line-height:1}
.gcell:last-child{border-bottom:none}
.gcell.over{background:var(--red-soft);color:var(--red)}
.gcell.limit{border-bottom:2px solid var(--red)}
.gnum{font-size:10px;color:var(--pencil);text-align:center;direction:ltr;padding:2px 0;border-top:1px solid var(--grid)}
.selfeval{display:flex;gap:10px;margin-top:12px}
.selfeval button{flex:1;font-family:var(--kyo);font-size:26px;padding:8px;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px}
.selfeval button span{display:block;font-family:var(--ui);font-size:12px;color:var(--pencil)}
.list{display:grid;gap:10px}
.item{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:12px 14px}
.item .mk{font-family:var(--kyo);font-size:22px;width:32px;text-align:center;color:var(--red);flex:none}
.item .mk.none{color:var(--grid-soft)}
.item small{display:block;color:var(--pencil);font-size:13px}
ol.flow{padding-left:1.4em;margin:0}
ol.flow li{margin-bottom:10px}
.sentence{font-family:var(--kyo);font-size:22px;line-height:2.2;display:flex;flex-wrap:wrap;align-items:center}
.ch{padding:0 1px}
.gap{border:none;background:none;width:14px;height:40px;padding:0;position:relative;color:var(--grid-soft)}
.gap::after{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:currentColor;opacity:.5}
.gap.on{color:var(--red)}
.gap.on::after{opacity:1;transform:rotate(18deg)}
.gap.miss{color:var(--ok)}
.gap.miss::after{opacity:1;transform:rotate(18deg)}
.units label{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--grid-soft);font-size:16px}
.units input{width:22px;height:22px;flex:none}
.bar{height:6px;background:var(--grid-soft);border-radius:3px;overflow:hidden;margin-top:4px;flex:1}
.bar i{display:block;height:100%;background:var(--grid)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--pencil)}
.foot{margin-top:28px;font-size:13px;color:var(--pencil);display:flex;gap:16px;flex-wrap:wrap}
.foot button{background:none;border:none;color:var(--pencil);text-decoration:underline;padding:0;font-size:13px}
.evc{display:block;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:12px 14px;margin-bottom:8px;font-family:var(--kyo);font-size:17px;line-height:1.7}
.evc.sel{border-color:var(--grid);background:var(--grid-soft)}
.evc.good{border-color:var(--ok)}
.evc.bad{border-color:var(--red);background:var(--red-soft)}
.evc.missed{border-color:var(--ok);border-style:dashed}
.evc small{display:block;font-family:var(--ui);font-size:13px;color:var(--pencil);margin-top:4px}
.opt{display:block;width:100%;text-align:left;background:var(--sheet);border:1.5px solid var(--grid-soft);border-radius:6px;padding:12px 14px;margin-bottom:8px;font-size:16px}
.opt.ok{border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.ng{border-color:var(--red);color:var(--red)}
.pool,.built{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.built{border:1.5px dashed var(--grid);border-radius:6px;padding:8px;margin-bottom:12px}
.wcard{font-family:var(--kyo);font-size:17px;background:var(--sheet);border:1.5px solid var(--grid);border-radius:4px;padding:8px 10px;line-height:1.4}
.wcard.used{opacity:.25;pointer-events:none}
.wcard.wrong{border-color:var(--red);color:var(--red)}
.ref{font-size:15px;background:var(--grid-soft);border-radius:6px;padding:10px 12px;margin-bottom:14px}
.ref b{font-family:var(--kyo);font-size:17px}
.stepname{display:flex;gap:4px;margin-bottom:14px;font-size:12px;color:var(--pencil)}
.stepname span{flex:1;text-align:center;border-top:4px solid var(--grid-soft);padding-top:4px}
.stepname span.on{border-color:var(--grid);color:var(--ink);font-weight:700}
.lvdots{display:inline-flex;gap:4px;margin-left:6px;vertical-align:middle}
.lvdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--grid)}
.lvdots i.on{background:var(--grid)}
.checkline{display:flex;gap:10px;align-items:flex-start;padding:6px 0;font-size:15px}
.checkline input{width:20px;height:20px;flex:none;margin-top:3px}
</style>

  {q:"「大人になれなかった」のは、ヒロユキだけか。",opts:["戦争で、大人になる前に死んだ子供はたくさんいた","ヒロユキだけだった"],a:0,why:"原爆や空襲でも、多くの子供が亡くなった。"}],
 cards:["ヒロユキだけでなく、","戦争で大人になれずに死んだ","多くの子供たちに","向けて書いているから。"], decoy:["僕には弟が何人もいたから。"],
 points:["ヒロユキだけではない、が入っている","戦争で死んだ多くの子供たち、が入っている","文末が「から。」"]}
];

const TSUMUGU=[];for(let i=0;i<Math.max(OTOUTO.length,TSUMUGU_H.length);i++){if(OTOUTO[i])TSUMUGU.push(OTOUTO[i]);if(TSUMUGU_H[i])TSUMUGU.push(TSUMUGU_H[i]);}

</script>
<script>
const KEY="kokugo-lab-v1";
function load(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):{};}catch(e){return {};}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=Object.assign({kanji:{},extraKanji:[],units:{},daily:{},kij:{},tsu:{},rev:{},extraRev:[],bun:{},days:[]},load());
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const UNIT_NAMES={"弟たち":"大人になれなかった弟たちに","星の花":"星の花が降るころに"};
function allKanji(){return KANJI_BASE.map(a=>({u:a[0],k:a[1],r:a[2],h:a[3]})).concat(S.extraKanji).map(o=>Object.assign({id:o.u+"|"+o.k},o));}
function units(){const u=[];allKanji().forEach(o=>{if(!u.includes(o.u))u.push(o.u)});return u;}
function unitOn(u){return S.units[u]!==false;}
function allRev(){return REVENGE_BASE.concat(S.extraRev);}
function isWeekend(){const d=new Date().getDay();return d===0||d===6;}
function ensureDaily(){if(S.daily.date!==today()){S.daily={date:today(),kanjiDone:false,kijDone:false,queue:null,tsuId:null};save();}}
function markDay(){if(S.daily.kanjiDone&&S.daily.kijDone&&!S.days.includes(today())){S.days.push(today());S.days=S.days.slice(-120);save();}}
function streak(){let n=0;const d=new Date();for(;;){const k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");if(S.days.includes(k)){n++;d.setDate(d.getDate()-1);}else if(n===0&&k===today()){d.setDate(d.getDate()-1);}else break;}return n;}
function genko(text,max){
  const ch=[...String(text).replace(/\n/g,"")];
  const per=10;const need=Math.max(max||0,ch.length,10);const cols=Math.ceil(need/per);
  let h='<div class="genko-wrap"><div class="genko">';
  for(let c=0;c<cols;c++){h+='<div class="gcol">';for(let r=0;r<per;r++){const i=c*per+r;const over=max&&i>=max&&i<ch.length;const lim=max&&i===max-1;h+=`<div class="gcell${over?" over":""}${lim?" limit":""}">${ch[i]?esc(ch[i]):""}</div>`;}h+=`<div class="gnum">${(c+1)*per}</div></div>`;}
  return h+"</div></div>";
}
function count(t){return [...String(t).replace(/\n/g,"")].length;}
function maru(el){const d=document.createElement("div");d.className="maru";d.innerHTML='<svg viewBox="0 0 200 200" width="180" height="180"><circle cx="100" cy="100" r="80" transform="rotate(-100 100 100)"/></svg>';el.appendChild(d);setTimeout(()=>d.remove(),1400);}
function head(back){return `<header class="top">${back?'<button class="back" onclick="home()">← もどる</button>':'<h1 class="logo">国語学習サポート</h1>'}<span class="date">${new Date().toLocaleDateString("ja-JP",{month:"long",day:"numeric",weekday:"short"})}</span></header>`;}

/* ---------- HOME ---------- */
function home(){
  ensureDaily();
  const st=streak();
  $("#app").innerHTML=head(false)+`
  <h2>今日のメニュー</h2>
  <div class="menu">
    <button class="task${S.daily.kanjiDone?" done":""}" onclick="startKanji(false)"><span class="num">${S.daily.kanjiDone?"○":"一"}</span><span><span class="t">漢字 5問</span><span class="s">${S.daily.kanjiDone?"今日の分はできた。もう5問やってもいい":"紙に書いて、自分で丸つけ"}</span></span></button>
    <button class="task${S.daily.kijDone?" done":""}" onclick="startTsu()"><span class="num">${S.daily.kijDone?"○":"二"}</span><span><span class="t">言葉を紡ぐ（記述 1問）</span><span class="s">${S.daily.kijDone?"今日の分はできた":esc(tsuSub())}</span></span></button>
  </div>
  <h3>${isWeekend()?"週末にやること":"週末用"}</h3>
  <div class="sub">
    <button class="subbtn" onclick="revList()"><b>ワークの見直し</b><span>赤で直した記述を、答えをかくして書き直す</span></button>
    <button class="subbtn" onclick="bunsetsu()"><b>文節チェック</b><span>文を文節に区切る</span></button>
  </div>
  <p class="streak">${st?`毎日の2つを続けた日：${st}日`:"漢字と言葉を紡ぐの2つで、今日の分は完了"}</p><p style="font-size:13px;color:var(--pencil);margin:4px 0 0">言葉を紡ぐは、教科書とノートを手元に置いてやろう。</p>
  <div class="foot"><button onclick="settings()">習った教材・問題の追加</button><button onclick="tsuList()">言葉を紡ぐの問い一覧</button></div>`;
  window.scrollTo(0,0);
}

/* ---------- KANJI ---------- */
let KQ=null;
function buildQueue(){
  const t=today();const items=allKanji().filter(o=>unitOn(o.u));
  const due=items.filter(o=>S.kanji[o.id]&&S.kanji[o.id].due<=t).sort((a,b)=>S.kanji[a.id].due<S.kanji[b.id].due?-1:1);
  const fresh=items.filter(o=>!S.kanji[o.id]);
  return due.concat(fresh).slice(0,5).map(o=>({id:o.id,dir:Math.random()<.65?"w":"r"}));
}
function startKanji(extra){
  ensureDaily();
  let q;
  if(!extra&&!S.daily.kanjiDone&&S.daily.queue){q=S.daily.queue;}
  else{q=buildQueue();if(!extra&&!S.daily.kanjiDone){S.daily.queue=q;save();}}
  if(S.daily.kanjiDone&&!extra){q=buildQueue();extra=true;}
  if(!q.length){$("#app").innerHTML=head(true)+`<div class="card"><p>いま出せる漢字がありません。</p><p>次の復習の日まで待つか、「習った教材・問題の追加」で教材をふやしてください。</p></div>`;return;}
  KQ={q,i:0,res:[],extra};kanjiCard(false);
}
function kanjiCard(open){
  const it=KQ.q[KQ.i];const o=allKanji().find(x=>x.id===it.id);
  if(!o){KQ.i++;return KQ.i<KQ.q.length?kanjiCard(false):kanjiEnd();}
  const dots=KQ.q.map((_,j)=>`<i class="${j<KQ.res.length?(KQ.res[j]?"on":"ng"):""}"></i>`).join("");
  const blank=o.h.replace("（　）",`<em>${it.dir==="w"?"（　　）":esc(o.k)}</em>`);
  const full=o.h.replace("（　）",`<em>${esc(o.k)}</em>`);
  const qMain=it.dir==="w"?esc(o.r):esc(o.k);
  const ask=it.dir==="w"?"漢字で書こう":"読みを書こう";
  $("#app").innerHTML=head(true)+`<div class="dots">${dots}</div>
  <div class="card" id="kc">
    <div class="unit">${esc(UNIT_NAMES[o.u]||o.u)}　${ask}</div>
    <div class="big">${qMain}</div>
    <div class="phrase">${it.dir==="w"?blank.replace("<em>（　　）</em>",`<em>（${esc(o.r)}）</em>`):blank}</div>
    ${open?`<div class="note" style="text-align:center"><div class="big" style="font-size:40px;margin:0">${it.dir==="w"?esc(o.k):esc(o.r)}</div><div class="phrase">${full}</div></div>
    <div class="row"><button class="btn red" onclick="kanjiAns(false)">まちがえた</button><button class="btn" onclick="kanjiAns(true)">書けた</button></div>`
    :`<p style="text-align:center;color:var(--pencil);margin-top:14px;font-size:14px">紙に書いてから答えを見る</p><div class="row"><button class="btn line" onclick="kanjiCard(true)">答えを見る</button></div>`}
  </div>`;
}
function kanjiAns(ok){
  const it=KQ.q[KQ.i];const s=S.kanji[it.id]||{lv:-1};
  if(ok){if(s.lv<=0){s.lv=1;s.due=addDays(7);}else if(s.lv===1){s.lv=2;s.due=addDays(21);}else{s.lv=3;s.due=addDays(60);}}
  else{s.lv=0;s.due=addDays(2);}
  S.kanji[it.id]=s;KQ.res.push(ok);save();
  if(ok)maru($("#kc"));
  setTimeout(()=>{KQ.i++;if(KQ.i<KQ.q.length)kanjiCard(false);else kanjiEnd();},ok?650:150);
}
function kanjiEnd(){
  if(!KQ.extra){S.daily.kanjiDone=true;S.daily.queue=null;save();markDay();}
  const n=KQ.res.filter(Boolean).length;
  $("#app").innerHTML=head(true)+`<div class="card" style="text-align:center"><div class="big">${n} / ${KQ.res.length}</div>
  <p>${n===KQ.res.length?"ぜんぶ書けた。":"まちがえた漢字は2日後にまた出てくる。"}</p>
  ${kanjiProgress()}
  <div class="row"><button class="btn line" onclick="startKanji(true)">もう5問</button><button class="btn" onclick="home()">メニューへ</button></div></div>`;
}
function kanjiProgress(){
  return units().filter(unitOn).map(u=>{const it=allKanji().filter(o=>o.u===u);const m=it.filter(o=>S.kanji[o.id]&&S.kanji[o.id].lv>=2).length;
  return `<div class="prog" style="margin-top:10px"><span style="min-width:8em;text-align:left">${esc(UNIT_NAMES[u]||u)}</span><span class="bar"><i style="width:${Math.round(m/it.length*100)}%"></i></span><span>${m}/${it.length}</span></div>`;}).join("")+`<p style="font-size:12px;color:var(--pencil);margin-top:8px">2回つづけて書けたら定着としてカウント</p>`;
}

/* ---------- 言葉を紡ぐ ---------- */
const STEPS={1:["問い","根拠","言いかえ","つなぐ","書く"],2:["問い","根拠","言いかえ","書く"],3:["問い","書く"]};
const LVNAME={1:"段階1　カードで組み立てる",2:"段階2　カードなしで書く",3:"段階3　問いだけで書く"};
let T=null;
function tsuState(id){return S.tsu[id]||{lv:1,done:false,hist:[]};}
function tsuItems(){const on=TSUMUGU.filter(t=>unitOn(t.unit));return on.length?on:TSUMUGU;}
function pickTsu(){
  ensureDaily();
  if(S.daily.tsuId&&TSUMUGU.find(t=>t.id===S.daily.tsuId))return S.daily.tsuId;
  const items=tsuItems();const open=items.filter(t=>!tsuState(t.id).done);
  let pick;
  if(open.length){const m=Math.min(...open.map(t=>tsuState(t.id).lv));pick=open.find(t=>tsuState(t.id).lv===m);}
  else{pick=items.slice().sort((a,b)=>{const x=tsuState(a.id).hist.slice(-1)[0],y=tsuState(b.id).hist.slice(-1)[0];return (x?x.d:"")<(y?y.d:"")?-1:1;})[0];}
  S.daily.tsuId=pick.id;save();return pick.id;
}
function tsuSub(){const t=TSUMUGU.find(x=>x.id===pickTsu());const s=tsuState(t.id);return `「${t.title}」　${s.done?"復習":"段階"+s.lv}`;}
function lvDots(s){return `<span class="lvdots">${[1,2,3].map(i=>`<i class="${s.done||i<s.lv?"on":""}"></i>`).join("")}</span>`;}
function startTsu(id){
  const it=TSUMUGU.find(t=>t.id===(id||pickTsu()));const s=tsuState(it.id);
  if(!INTRO_SKIP&&!(S.intro&&S.intro[it.unit])){const after=id||"daily";return it.unit==="星の花"?curveStart(after):timelineStart(after);}
  INTRO_SKIP=false;
  T={it,lv:s.done?3:s.lv,si:0,daily:!id||id===S.daily.tsuId,end:null,sel:[],evChecked:false,ii:0,iiPick:null,built:[],pool:null,buildOk:false,shown:false};
  T.pool=shuffle(it.cards.concat(it.decoy).map((c,i)=>({c,i})));
  tsuRender();
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function tsuNext(){T.si++;tsuRender();window.scrollTo(0,0);}
function tsuRender(){
  const it=T.it;const steps=STEPS[T.lv];const step=steps[T.si];
  let h=head(true)+`<div class="stepname">${steps.map((s,i)=>`<span class="${i<=T.si?"on":""}">${s}</span>`).join("")}</div><div class="card" id="tc">`;
  h+=`<div class="unit">${esc(UNIT_NAMES[it.unit]||it.unit)}　${LVNAME[T.lv]}</div>`;
  if(step==="問い"){
    h+=`<div class="ref">教科書 <b>p.${esc(it.page)}　${esc(it.lines)}</b> を読んでから始めよう。</div><p class="q">${esc(it.q)}</p>
    <p style="font-weight:700;margin-bottom:8px">この問いの答えは、どんな形で終わる？</p>
    ${Object.keys(ENDS).map(k=>`<button class="opt${T.end===k?(k===it.end?" ok":" ng"):""}" onclick="T.end='${k}';tsuRender()">${ENDS[k].label}</button>`).join("")}`;
    if(T.end===it.end)h+=`<div class="note">答えは「${ENDS[it.end].label}」で終わる。字数は${it.max}字以内。問いの最後の言葉が、答えの終わり方を決めている。</div><div class="row"><button class="btn" onclick="tsuNext()">次へ</button></div>`;
    else if(T.end)h+=`<div class="note red">問いの最後の言葉をもう一度見てみよう。</div>`;
  }else if(step==="根拠"){
    h+=`<p class="q">${esc(it.q)}</p><p style="font-size:15px">教科書p.${esc(it.page)}を読んで、答えの<b>根拠</b>になるものを<b>すべて</b>選ぼう。</p>`;
    it.ev.forEach((e,i)=>{let c="evc";let note="";
      if(T.evChecked){if(e.ok&&T.sel.includes(i))c+=" good";else if(e.ok)c+=" missed";else if(T.sel.includes(i))c+=" bad";note=`<small>${e.ok?"根拠になる：":"根拠にならない："}${esc(e.why)}</small>`;}
      else if(T.sel.includes(i))c+=" sel";
      h+=`<button class="${c}" onclick="tsuEv(${i})">${T.evChecked?(e.ok?"✓ ":"✗ "):""}${esc(e.t)}${note}</button>`;});
    if(!T.evChecked)h+=`<div class="row"><button class="btn" ${T.sel.length?"":"disabled"} onclick="T.evChecked=true;tsuRender()">確かめる</button></div>`;
    else{const miss=it.ev.filter((e,i)=>e.ok&&!T.sel.includes(i)).length,bad=it.ev.filter((e,i)=>!e.ok&&T.sel.includes(i)).length;
      h+=`<div class="note${miss||bad?" red":""}">${!miss&&!bad?"根拠をぴったり選べた。":"点線のものは見落とした根拠、赤いものは根拠にならないもの。理由を読んでおこう。"}</div><div class="row"><button class="btn" onclick="tsuNext()">次へ</button></div>`;}
  }else if(step==="言いかえ"){
    const q=it.iikae[T.ii];
    h+=`<p style="font-size:15px;color:var(--pencil)">本文の行動や様子を、気持ちや意味の言葉に言いかえる。（${T.ii+1}/${it.iikae.length}）</p><p class="q">${esc(q.q)}</p>`;
    q.opts.forEach((o,i)=>{let c="opt";if(T.iiPick!==null){if(i===q.a)c+=" ok";else if(i===T.iiPick)c+=" ng";}h+=`<button class="${c}" onclick="tsuIi(${i})">${esc(o)}</button>`;});
    if(T.iiPick!==null){h+=`<div class="note${T.iiPick===q.a?"":" red"}">${T.iiPick===q.a?"そのとおり。":"答えは緑のもの。"}${esc(q.why)}</div><div class="row"><button class="btn" onclick="tsuIiNext()">次へ</button></div>`;}
  }else if(step==="つなぐ"){
    const text=T.built.map(i=>T.pool[i].c).join("");
    h+=`<p class="q">${esc(it.q)}</p><p style="font-size:15px">拾った根拠と言いかえた言葉をつないで、答えを組み立てよう。<b>使わないカードが1枚</b>まざっている。</p>
    <div class="built">${T.built.map((pi,k)=>`<button class="wcard${T.wrongAt===k?" wrong":""}" onclick="tsuUnbuild(${k})">${esc(T.pool[pi].c)}</button>`).join("")||'<span style="color:var(--pencil);font-size:14px;padding:6px">下のカードをタップして並べる</span>'}</div>
    <div class="pool">${T.pool.map((p,i)=>`<button class="wcard${T.built.includes(i)?" used":""}" onclick="tsuBuild(${i})">${esc(p.c)}</button>`).join("")}</div>
    ${genko(text,it.max)}`;
    if(T.buildOk)h+=`<div class="note">つながった。次はこの答えを、見ないでノートに書く。</div><div class="row"><button class="btn" onclick="tsuNext()">次へ</button></div>`;
    else{if(T.buildMsg)h+=`<div class="note red">${T.buildMsg}</div>`;h+=`<div class="row"><button class="btn" ${T.built.length?"":"disabled"} onclick="tsuCheckBuild()">確かめる</button></div>`;}
  }else if(step==="書く"){
    const model=it.cards.join("");
    if(!T.shown){
      h+=`${T.lv===3?`<div class="ref">教科書 <b>p.${esc(it.page)}　${esc(it.lines)}</b> を読み、根拠に線を引いてから書こう。</div>`:""}<p class="q">${esc(it.q)}</p>
      <p style="font-size:15px">${T.lv===1?"さっき組み立てた答えを、画面を見ないでノートに書こう。":T.lv===2?"拾った根拠と言いかえた言葉を使って、ノートに自分で書こう。":"ノートに書こう。"}答えは「<b>${ENDS[it.end].label}</b>」で終わる。<b>${it.max}字以内</b>。</p>
      ${genko("",it.max)}
      <div class="row"><button class="btn" onclick="T.shown=true;tsuRender()">書けたら答えの例を見る</button></div>`;
    }else{
      h+=`<p class="q">${esc(it.q)}</p><h3 style="margin-top:0">答えの例</h3>${genko(model,it.max)}
      <p style="font-size:15px;margin-top:10px">ノートの答えに、次のことが入っているか確かめよう。言葉がちがっても、中身が同じならよい。</p>
      ${it.points.map((p,i)=>`<label class="checkline"><input type="checkbox">${esc(p)}</label>`).join("")}
      <label class="checkline"><input type="checkbox">${it.max}字以内に収まっている</label>
      <div class="selfeval"><button onclick="tsuEval('○')">○<span>全部入っていた</span></button><button onclick="tsuEval('△')">△<span>足りないものがあった</span></button><button onclick="tsuEval('×')">×<span>書けなかった</span></button></div>`;
    }
  }
  $("#app").innerHTML=h+`</div>`;
}
function tsuEv(i){if(T.evChecked)return;T.sel=T.sel.includes(i)?T.sel.filter(x=>x!==i):T.sel.concat(i);tsuRender();}
function tsuIi(i){if(T.iiPick!==null)return;T.iiPick=i;tsuRender();}
function tsuIiNext(){T.iiPick=null;if(T.ii<T.it.iikae.length-1){T.ii++;tsuRender();}else tsuNext();}
function tsuBuild(i){if(T.buildOk||T.built.includes(i))return;T.built.push(i);T.wrongAt=null;T.buildMsg="";tsuRender();}
function tsuUnbuild(k){if(T.buildOk)return;T.built.splice(k,1);T.wrongAt=null;T.buildMsg="";tsuRender();}
function tsuCheckBuild(){
  const it=T.it;const seq=T.built.map(i=>T.pool[i].c);
  if(seq.join("")===it.cards.join("")){T.buildOk=true;tsuRender();maru($("#tc"));return;}
  const d=seq.findIndex(c=>it.decoy.includes(c));
  if(d>=0){T.wrongAt=d;T.buildMsg="赤いカードは、この答えには使わない。根拠と言いかえを思い出そう。";}
  else if(seq.length<it.cards.length){T.wrongAt=null;T.buildMsg="まだカードが足りない。";}
  else{const k=seq.findIndex((c,j)=>c!==it.cards[j]);T.wrongAt=k;T.buildMsg=k===seq.length-1||seq[seq.length-1]!==it.cards[it.cards.length-1]?`答えの最後は「${ENDS[it.end].label}」の形になるカード。`:"赤いカードから、順番を見直そう。";}
  tsuRender();
}
function tsuEval(m){
  const it=T.it;const s=tsuState(it.id);const lv=T.lv;
  s.hist.push({d:today(),lv,res:m});s.hist=s.hist.slice(-20);
  if(m==="○"&&!s.done){if(s.lv>=3)s.done=true;else s.lv++;}
  S.tsu[it.id]=s;if(T.daily)S.daily.kijDone=true;save();markDay();
  if(m==="○")maru($("#tc"));

    const i=Math.max(0,Math.min(6,Math.round((px-25)/50)));let v=2-(py-CT)/(CB-CT)*4;v=Math.max(-2,Math.min(2,Math.round(v*2)/2));CV.v[i]=v;CV.sel=i;};

    h+=`<div class="note">記述の「〜気持ちから、〜気持ちに変わった」は、この線の上下を言葉にしたもの。きっかけになる描写を根拠として使う。</div><div class="row"><button class="btn" onclick="introDone('星の花')">${CV.after?"今日の問いへ":"終わる"}</button></div>`;

  <div class="row"><button class="btn" onclick="addKanji()">漢字を追加</button></div>
  <h2 style="margin-top:28px">ワークの見直し問題を追加</h2>
  <label class="f">教材名</label><input id="ru">
  <label class="f">ワークのページ</label><input id="rp" placeholder="例：66">
  <label class="f">設問（短くまとめてよい）</label><input id="rq">
  <label class="f">何を聞かれている？</label><select id="rt">${Object.keys(TYPES).map(t=>`<option>${t}</option>`).join("")}</select>
  <label class="f">字数（なければ0）</label><input id="rm" type="number" min="0" value="30">
  <div class="row"><button class="btn" onclick="addRev()">見直し問題を追加</button></div>
  <p id="msg" style="color:var(--ok);margin-top:10px"></p>
  <div class="foot"><button onclick="if(confirm('記録をすべて消しますか？')){S={kanji:{},extraKanji:S.extraKanji,units:{},daily:{},kij:{},tsu:{},rev:{},extraRev:S.extraRev,bun:{},days:[]};save();home();}">記録をリセット（追加した問題は残る）</button></div>`;
}
function addKanji(){const u=$("#au").value.trim(),k=$("#ak").value.trim(),r=$("#ar").value.trim();let h=$("#ah").value.trim();
  if(!u||!k||!r){$("#msg").textContent="教材名・漢字・読みを入れてください。";return;}
  if(!h.includes("（　）"))h="（　）";S.extraKanji.push({u,k,r,h});save();["#ak","#ar","#ah"].forEach(s=>$(s).value="");$("#msg").textContent=`「${k}」を追加した。`;}
function addRev(){const u=$("#ru").value.trim(),p=$("#rp").value.trim(),q=$("#rq").value.trim();
  if(!u||!q){$("#msg").textContent="教材名と設問を入れてください。";return;}
  S.extraRev.push({id:"x"+Date.now(),u,p:p||"?",q,type:$("#rt").value,max:parseInt($("#rm").value)||0});save();["#rq","#rp"].forEach(s=>$(s).value="");$("#msg").textContent="見直し問題を追加した。";}

home();
</script>
</body>
</html>
